<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnboundRun</title>
<meta name="description" content="UnboundRun: endless parkour in many art styles, rendered live at 40 fps. Coming soon.">
<meta property="og:title" content="UnboundRun">
<meta property="og:description" content="Endless parkour in many art styles, rendered live at 40 fps. Coming soon.">
<meta property="og:image" content="https://yeyinglab.github.io/UnboundRun/assets/img/teaser.gif">
<meta property="og:url" content="https://yeyinglab.github.io/UnboundRun/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1424'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-weight='900' font-size='38' text-anchor='middle' fill='%23f5a524'%3EU%3C/text%3E%3C/svg%3E">
<style>
@font-face { font-family: "Lato"; font-weight: 400; src: url("assets/fonts/lato-regular.woff") format("woff"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url("assets/fonts/lato-bold.woff") format("woff"); }
@font-face { font-family: "Lato"; font-weight: 900; src: url("assets/fonts/lato-black.woff") format("woff"); }
:root {
  --night: #0a1424; --night2: #101c30; --nline: #1f2c42; --ntxt: #f4f7fb; --nmute: #9aa7b7;
  --amber: #f5a524; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--night); color: var(--ntxt); font: 400 17px/1.65 "Lato", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
.hero { position: relative; min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
.hero .bg { position: absolute; inset: -40px; background: url("assets/img/teaser.gif") center / cover no-repeat; filter: blur(28px) saturate(1.2); opacity: .45; }
.hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 50%, rgba(10,20,36,.55) 0%, rgba(10,20,36,.85) 100%); }
.in { position: relative; z-index: 2; text-align: center; padding: 72px 20px 56px; width: 100%; max-width: 1000px; }
.pill { display: inline-block; font: 700 12px/1 var(--mono); letter-spacing: 2.2px; text-transform: uppercase; color: #cfd8e3;
        border: 1px solid #33465f; background: rgba(16,28,48,.75); padding: 9px 12px; border-radius: 6px; }
.pill b { color: var(--amber); }
h1 { font-weight: 900; font-size: clamp(54px, 10vw, 140px); line-height: .95; margin: 22px 0 10px; letter-spacing: -2px; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
h2 { font-weight: 700; font-size: clamp(20px, 2.8vw, 34px); line-height: 1.25; margin: 0 0 30px; color: #eef2f7; }
.shot { margin: 0 auto 32px; max-width: 800px; border-radius: 16px; overflow: hidden; border: 1px solid var(--nline); background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.shot img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; border: 1px solid #33465f; background: rgba(16,28,48,.85);
       color: #fff; font-weight: 700; font-size: 15px; }
a.btn:hover { border-color: var(--amber); }
.btn.soon { color: var(--nmute); cursor: default; }
.btn small { font: 700 10.5px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--amber); }
.note { color: var(--nmute); margin: 26px 0 0; font-size: 15.5px; }
footer { position: relative; z-index: 2; text-align: center; padding: 22px 16px 30px; color: var(--nmute); font: 13px/1.5 var(--mono); border-top: 1px solid var(--nline); background: var(--night); }
footer a:hover { color: #fff; }
</style>
</head>
<body>
<header class="hero">
  <div class="bg" aria-hidden="true"></div>
  <div class="in">
    <span class="pill">YeyingLab · <b>Coming soon</b></span>
    <h1>UnboundRun</h1>
    <h2>Endless parkour in many art styles, rendered live at 40&nbsp;fps.</h2>
    <div class="shot"><img src="assets/img/teaser.gif" alt="UnboundRun demo: a runner moving through generated scenes in different art styles"></div>
    <div class="btns">
      <span class="btn soon">Paper <small>soon</small></span>
      <a class="btn" href="https://github.com/YeyingLab/UnboundRun">Code <small>soon</small></a>
      <span class="btn soon">Model <small>soon</small></span>
    </div>
    <p class="note">The paper, code and models will be released here.</p>
  </div>
</header>
<footer>© 2026 <a href="https://github.com/YeyingLab">YeyingLab</a></footer>
</body></html>
